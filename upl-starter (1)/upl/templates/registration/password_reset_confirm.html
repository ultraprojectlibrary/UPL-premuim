{% extends "base.html" %}{% block content %}<section class="narrow"><h1>Choose a new password</h1>
{% if validlink %}<form method="post">{% csrf_token %}{% include "_form.html" %}<button class="btn" type="submit">Save password</button></form>
{% else %}<p>This link is invalid or has expired. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>{% endif %}</section>{% endblock %}
