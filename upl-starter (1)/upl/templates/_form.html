{% if form.non_field_errors %}<div class="errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for f in form %}
<div class="field">
  <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <abbr title="required" class="req">*</abbr>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<small>{{ f.help_text }}</small>{% endif %}
  {% if f.errors %}<div class="errors" role="alert">{{ f.errors }}</div>{% endif %}
</div>
{% endfor %}
